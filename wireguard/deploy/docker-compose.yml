services:
  # 控制服务器后端
  backend:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.server
    container_name: sogame-backend
    restart: unless-stopped
    volumes:
      - sogame-data:/data
    environment:
      - SOGAME_DB_PATH=/data/sogame.db
      - SOGAME_LISTEN=:8080
      - SOGAME_ADMIN_TOKEN=${SOGAME_ADMIN_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sogame-net

  # Nginx + Web UI
  nginx:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    container_name: sogame-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # 通过 NGINX_CONF 环境变量切换 HTTP/HTTPS 配置（默认 nginx.conf）
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sogame-net

networks:
  sogame-net:
    driver: bridge

volumes:
  sogame-data:
