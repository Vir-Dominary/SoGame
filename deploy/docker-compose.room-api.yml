# ============================================================
# Room API 的 docker-compose 服务参考片段
#
# 来源：生产服务器 123.56.254.224 的 /root/docker-compose.yml 实际部署配置。
# 完整部署说明见 deploy/DEPLOY.md 与 server/room-api/README.md。
#
# 要点：
#   - healthcheck 用 room-api 内置的 -healthcheck（校验配置+SQLite 完整性），
#     不要用 wget/curl（运行镜像 debian:bookworm-slim 不含它们，会导致容器永久 unhealthy）
#   - 凭证经 env_file 注入（./room-api.env，由 server/room-api/deploy/prep-room-api.sh 生成）
#   - Room API 的对外暴露不在此处配置 traefik labels：入口统一由
#     deploy/traefik-dynamic.yml 的 legengen-rooms 路由(HTTPS)提供。
#     明文 IP 入口(Host=123.56.254.224 && PathPrefix(/rooms))已于 2026-09-24 下线。
#   - 生产经 traefik 反代，因此须设 ROOM_API_TRUST_PROXY=true 才能按真实客户端 IP 限流
# ============================================================

# 加入到 docker-compose.yml 的 services: 段中
  room-api:
    build: /root/room-api
    container_name: sogame-room-api
    env_file:
    - ./room-api.env
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - /usr/local/bin/room-api
      - -healthcheck
      timeout: 5s
    image: sogame-room-api:latest
    # 审计日志走 stdout：必须配置轮转，否则恶意请求洪泛会耗尽宿主磁盘。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
    - netbird
    restart: unless-stopped
    volumes:
    - /root/room-api-data:/data
    # 注意：不要 bind mount 宿主机 CA 文件（如 /etc/pki/tls/certs/ca-bundle.crt
    # 是 RHEL 系路径）——宿主机缺该文件时 Docker 会自动创建空目录挂载，
    # 遮蔽镜像内 ca-certificates，导致 Management HTTPS 全部 TLS 失败。