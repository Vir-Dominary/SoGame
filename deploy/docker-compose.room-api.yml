# ============================================================
# Room API 的 docker-compose 服务参考片段
#
# 来源：生产服务器 123.56.254.224 的 /root/docker-compose.yml 实际部署配置。
# 完整部署说明见 deploy/DEPLOY.md 与 server/room-api/README.md。
#
# 要点：
#   - healthcheck 用 room-api 内置的 -healthcheck（校验配置+SQLite 完整性），
#     不要用 wget/curl（运行镜像 debian:bookworm-slim 不含它们，会导致容器永久 unhealthy）
#   - 凭证经 env_file 注入（./room-api.env，由 server/room-api/deploy/prep-room-api.sh 生成）
#   - 经 traefik 反代暴露：Host(123.56.254.224) && PathPrefix(/rooms)，
#     因此须设 ROOM_API_TRUST_PROXY=true 才能按真实客户端 IP 限流
# ============================================================

# 加入到 docker-compose.yml 的 services: 段中
  room-api:
    build: /root/room-api
    container_name: sogame-room-api
    env_file:
    - ./room-api.env
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - /usr/local/bin/room-api
      - -healthcheck
      timeout: 5s
    image: sogame-room-api:latest
    labels:
    - traefik.enable=true
    - traefik.http.routers.sogame-rooms.rule=Host(`123.56.254.224`) && PathPrefix(`/rooms`)
    - traefik.http.routers.sogame-rooms.entrypoints=web
    - traefik.http.routers.sogame-rooms.service=sogame-rooms
    - traefik.http.routers.sogame-rooms.priority=110
    - traefik.http.services.sogame-rooms.loadbalancer.server.port=8080
    networks:
    - netbird
    restart: unless-stopped
    volumes:
    - /root/room-api-data:/data
    - /etc/pki/tls/certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro