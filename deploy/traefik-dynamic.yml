http:
  middlewares:
    legengen-https-redirect:
      redirectScheme:
        permanent: true
        scheme: https
  routers:
    legengen-backend:
      entryPoints:
      - websecure
      priority: 100
      rule: Host(`legengen.top`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`)
        || PathPrefix(`/api`) || PathPrefix(`/oauth2`))
      service: netbird-server@docker
      # 显式 certResolver：tls:{} 空对象在 websecure 无默认证书配置时会
      # 回退 traefik 自签默认证书，客户端 TLS 校验失败。
      tls:
        certResolver: le
    legengen-dashboard:
      entryPoints:
      - websecure
      priority: 1
      rule: Host(`legengen.top`)
      service: dashboard@docker
      tls:
        certResolver: le
        domains:
        - main: legengen.top
    legengen-grpc:
      entryPoints:
      - websecure
      priority: 100
      rule: Host(`legengen.top`) && (PathPrefix(`/signalexchange.SignalExchange/`)
        || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))
      service: netbird-server-h2c@docker
      tls:
        certResolver: le
    legengen-http:
      entryPoints:
      - web
      middlewares:
      - legengen-https-redirect
      priority: 10
      rule: Host(`legengen.top`)
      service: noop@internal
    legengen-rooms:
      entryPoints:
      - websecure
      priority: 110
      rule: Host(`legengen.top`) && PathPrefix(`/rooms`)
      service: sogame-rooms@file
      tls:
        certResolver: le
  services:
    sogame-rooms:
      loadBalancer:
        servers:
        - url: http://sogame-room-api:8080
