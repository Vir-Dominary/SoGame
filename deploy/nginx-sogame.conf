# ============================================================
# SoGame 更新服务 — Nginx 配置片段
#
# 【注意】这是"独立 nginx 部署"（无容器/traefik 环境）的参考片段。
# 当前生产（123.56.254.224）使用 sogame-downloads 容器 + traefik 路由方案，
# 文件存放于 /opt/sogame/downloads/sogame/，见 deploy/DEPLOY.md。
# ============================================================

# --- 在 server {} block 中添加以下 location ---

location /sogame/ {
    alias /var/www/sogame/;
    autoindex off;

    # 禁用缓存，确保客户端总是获取最新的 update.json
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # 正确的 MIME 类型
    location ~ \.json$ {
        default_type application/json;
    }
    location ~ \.zip$ {
        default_type application/octet-stream;
    }
    location ~ \.sha256$ {
        default_type text/plain;
    }
}

