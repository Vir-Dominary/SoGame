server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 真实路径路由（/sogame、/sogame/download 等）SPA fallback
    # index.html 不缓存:每次回源校验(no-cache + ETag),保证入口永远最新
    location = /index.html {
        add_header Cache-Control "no-cache, public";
    }
    location = / {
        add_header Cache-Control "no-cache, public";
    }

    # 其余静态资源: no-cache + ETag 条件请求,既保证更新及时又避免重复下载
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "no-cache, public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}